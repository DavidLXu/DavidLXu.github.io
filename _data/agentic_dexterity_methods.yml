- id: gym-anything
  name: Gym-Anything for Robotics
  title: 让编程 Agent 创建环境，再用独立审计检验任务
  phase: 环境构建与验收
  input: 从产业活动中选出的物理工作，以及对仿真质量和任务有效性的书面要求。
  action: 创建者编写物理场景和强化学习环境。审计者根据约定检查实现，尝试找出物理行为、奖励或任务目标的漏洞。
  feedback: 将审计发现交还创建者修改，再重新检查模拟行为与任务可解性。
  evidence: 系统产出 RoboWorld：25 组仿真，分为 175 个训练环境和 25 个测试环境。这个规模统计覆盖多个行业与物理现象。
  url: https://arxiv.org/abs/2610.40565

- id: robouniverse
  name: RoboUniverse-10K
  title: 从真实视频构建带独立评分器的物理环境
  phase: 环境构建与验收
  input: 真实操作视频，以及待重建的任务目标与场景。
  action: Real2Sim 管线将操作转写为可执行、可重置的任务，生成环境和验证逻辑，再由质量审核环节复核。
  feedback: 执行 Agent 在隔离环境中操作；评分逻辑和特权状态对它隐藏。专家复核留出任务，用于检查模型对新任务的零样本表现。
  evidence: 作者发布 10,807 个环境，并单列 500 项 RoboUniverse-Verified 任务。模型交互记录的单位是多轮轨迹，和逐帧标注指力的机器人数据有不同用途。
  url: https://arxiv.org/abs/2611.31002

- id: gendexhand
  name: GenDexHand
  title: 从物体模型搭建可练习的场景
  phase: 任务生成
  input: 机器人手臂、灵巧手与可操作物体的模型。
  action: 语言模型提出任务和物体布局。仿真器搭建场景后，视觉语言模型从多个角度检查摆放，调整位置、朝向和尺寸。
  feedback: 重新渲染场景以检查修改效果。随后用运动规划完成接近动作，用分阶段强化学习练习接触动作。
  evidence: 作者用开柜、拿起瓶子和把苹果放进碗里三项任务检验训练效率。场景看起来合理之后，仍需用策略实际完成任务来检验可操作性。
  url: https://winniechen2002.github.io/GenDexHand/

- id: dexagent
  name: DexAgent
  title: 把人手示范转成机器人训练轨迹
  phase: 示范生成
  input: 一段第一视角的人类操作视频，以及描述目标的语言指令。
  action: 识别每只手的子目标和物体属性，调用工具重建仿真场景。用人手运动引导轨迹优化，在需要时生成新的动作代码。
  feedback: 用验证器检查重建和动作是否满足要求，修正未通过的步骤。复用通过检验的工具，在不同初态和视角下生成更多训练样本。
  evidence: 作者在 11 个实机任务中测试用这些数据训练的策略，包括装电池和打绳结。对接触力敏感的操作可能通过仿真检查，却在真机上失败。
  url: https://dexagent1.github.io/

- id: eureka
  name: Eureka
  title: 根据训练结果重写奖励函数
  phase: 奖励设计
  input: 自然语言任务说明和仿真环境源码，包括奖励函数可以读取的状态变量。
  action: 语言模型生成多份奖励代码。在 Isaac Gym 中为每个候选奖励分别训练强化学习策略，再按任务指标选出表现较好的候选。
  feedback: 把任务表现与各项奖励的训练统计反馈给模型，供它调整权重、修改表达式或增删奖励项，再训练下一批策略。
  evidence: Shadow Hand 先学会把笔转到指定姿态，再用连续目标练习转笔。比较两个奖励版本的代价包括重新训练策略所需的仿真步数。
  url: https://eureka-research.github.io/

- id: vlm-mpc
  name: VLM + MuJoCo MPC
  title: 看动作录像，调整控制器的代价权重
  phase: 控制调参
  input: 任务描述、当前代价项及其权重，以及灵巧手执行动作的录像。
  action: 视觉语言模型为下一轮提出权重。模型预测控制器在 MuJoCo 中试算多条动作序列，选择下一步关节目标。
  feedback: 比较执行录像与目标动作，例如球在掌中滚动的方向和幅度，再调整权重。控制器在两个调参回合之间持续按实测状态更新动作。
  evidence: 作者在仿生腱驱动手的滚球和抛翻任务中研究视觉反馈调参。模型能调整的行为取决于预先定义的代价项。
  url: https://arxiv.org/abs/2411.06183

- id: pyrua-dex
  name: PyRUA-Dex
  title: 让编程 Agent 在仿真中写出双手操作程序
  phase: 策略程序生成
  input: 任务说明、可反复运行的仿真环境，以及查询场景和控制双手的 Python 接口。开发时无需人类示范。
  action: 多个编程 Agent 并行尝试抓取、对齐和释放等步骤，再由一个 Agent 把成功的尝试整理成技能库和一份任务程序。测试时，固定下来的程序读取当前场景并控制双手，全程无需调用语言模型。
  feedback: 在随机布局中重跑程序，按阶段定位失败并修改对应函数。例如在工具整理任务中，初版几乎总能放好两把螺丝刀，却很少能敲中木块。修正后，32 个留出布局中敲中木块的次数从 4 次增至 17 次。
  evidence: 作者报告，在 Bench2Dex 的 26 项任务上，改进前后的总体成功率从 44.6% 升至 60.6%，最终综合得分为 72.9。另在 DexJoCo 的全随机化设置下，任务成功率为 81.0%。
  url: https://arxiv.org/abs/2611.33144

- id: handson
  name: HandsOn · move_eef
  title: 观察执行结果，逐次指定手掌和指关节目标
  phase: 在线控制
  input: 任务指令、三个视角的 RGB 图像、实测手掌位姿和指关节位置，以及上一次调用的执行反馈。
  action: 模型调用 move_eef，指定手掌的绝对位姿和每只手 20 个指关节的目标。运动学模块把目标转换为 30 Hz 的控制轨迹。
  feedback: 执行器报告运动是否可行。动作结束后，模型根据新图像、实测位姿和目标误差决定是否调整抓姿或继续操作。
  evidence: GPT-6 未经 HandsOn 微调，在 Core-50 中成功 26/500 次，在 Transfer-16 中成功 3/160 次。推理时仿真暂停，调用次数也影响完成率。
  url: https://arxiv.org/abs/2610.26765

- id: dreureka
  name: DrEureka
  title: 用仿真压力测试选择物理参数的训练范围
  phase: 实机迁移
  input: 任务说明、安全约束、环境源码和可扰动的物理参数。
  action: 先生成奖励并训练初始策略，再改变物理参数测试策略的容忍范围。语言模型据此提出域随机化分布，在抽样得到的环境里重新训练。
  feedback: 策略在各类仿真条件下的表现为参数选择提供依据，最终用真实硬件检验迁移效果。
  evidence: 灵巧手实验检验了手内方块旋转。论文用仿真结果选择随机化配置，实机表现属于迁移评测。
  url: https://eureka-research.github.io/dr-eureka/
